name: okulacooker
description: "OkulaCooker - budget-aware weekly dinner planner and grocery list."
publish_to: 'none'

version: 2.2.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0
  printing: ^5.13.3
  pdf: ^3.11.1
  share_plus: ^10.1.2
  geolocator: ^14.0.2
  http: ^1.6.0
  web: ^1.1.1
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/icons/food/
    - assets/photos/

  fonts:
    - family: SchibstedGrotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SchibstedGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SchibstedGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SchibstedGrotesk-Bold.ttf
          weight: 700
        - asset: assets/fonts/SchibstedGrotesk-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: false
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#F6FAF6"
    theme_color: "#2E7D4F"
