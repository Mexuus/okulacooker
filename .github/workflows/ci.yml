name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    name: Analyze, test, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Base href lets the same build run from https://<user>.github.io/<repo>/
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  ios:
    name: Build iOS (unsigned)
    needs: test
    # macOS minutes are billed 10x on private repos; skip on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr TapCook-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: TapCook-unsigned-ipa
          path: TapCook-unsigned.ipa

  deploy-web:
    name: Deploy web to GitHub Pages
    # Pages on private repos needs a paid plan; skip instead of failing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tapcook:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (read-only, no capabilities)
        run: |
          docker run -d --name tapcook -p 8080:8080 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e TAPCOOK_SECURE_URL='https://example.com/x"},"y":"' tapcook:test
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fs http://localhost:8080/ | grep -q '<title>TapCook</title>'
          curl -fs http://localhost:8080/some/deep/link | grep -q 'flutter_bootstrap.js'
          curl -fs http://localhost:8080/assets/assets/data/recipe_db.json | head -c 40 | grep -q '"version"'
          curl -fsI -H 'Accept-Encoding: gzip' http://localhost:8080/main.dart.js | grep -qi 'content-encoding: gzip'
          curl -fsI http://localhost:8080/ | grep -qi 'x-content-type-options: nosniff'
          # Runtime config: injection attempt is neutralised into valid JSON.
          curl -fs http://localhost:8080/config.json | tee /dev/stderr | python3 -c \
            'import json,sys; d=json.load(sys.stdin); assert d=={"secureUrl":"https://example.com/x,y:"}, d'
          curl -fsI http://localhost:8080/config.json | grep -qi 'content-type: application/json'
          docker rm -f tapcook
          docker run -d --name tapcook -p 8080:8080 --read-only --tmpfs /tmp tapcook:test
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          test "$(curl -fs http://localhost:8080/config.json)" = '{}'
          docker logs tapcook
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Publish (amd64 + arm64)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
