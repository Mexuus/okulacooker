server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers (set here only; location blocks below don't use
    # add_header, so these are inherited everywhere).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/csv text/javascript application/javascript application/json
               application/wasm application/manifest+json image/svg+xml font/ttf font/otf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime settings written at start-up by 40-okulacooker-config.sh. Matches any
    # prefix so sub-path (BASE_HREF) deployments work too.
    location ~ /config\.json$ {
        alias /tmp/okulacooker-config.json;
        default_type application/json;
        expires -1;
    }

    # App code and data aren't content-hashed: always revalidate (cheap 304s
    # via ETag) so new deployments show up immediately.
    location ~* \.(?:html|js|mjs|json|wasm|csv)$ {
        expires -1;
        try_files $uri =404;
    }

    # Fonts and images rarely change.
    location ~* \.(?:ttf|otf|woff2?|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Single-page app: unknown paths load the app shell.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
